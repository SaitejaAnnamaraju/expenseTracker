# Render Blueprint - New > Blueprint > pick this repo.
# You will be prompted for the values marked "sync: false" (your hosted MySQL details).
services:
  - type: web
    name: expense-tracker
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:render   # creates tables + test accounts, then starts the app
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true             # Render creates a strong random secret
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        sync: false
